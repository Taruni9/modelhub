services:
  - type: web
    name: modelcloud-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: ML Model Serving Platform
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads
