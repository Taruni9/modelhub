services:
  - type: web
    name: modelhub-backend
    env: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: ModelHub ML Serving Platform
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads
      - key: JWT_SECRET_KEY
        generateValue: true
